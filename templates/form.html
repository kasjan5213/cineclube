{% extends "base.html" %}

{% block titulo %}{{ acao }} · CineClube{% endblock %}

{% block conteudo %}
<h1>{{ acao }} filme</h1>

<form method="post" class="formulario" novalidate>
    <label>
        Título
        <input type="text" name="titulo" required minlength="2"
               value="{{ filme.titulo if filme else '' }}">
    </label>

    <label>
        Diretor
        <input type="text" name="diretor" required minlength="2"
               value="{{ filme.diretor if filme else '' }}">
    </label>

    <label>
        Ano
        <input type="number" name="ano" required
               value="{{ filme.ano if filme and filme.ano else '' }}">
    </label>

    <label>
        Gênero
        <select name="genero" required>
            <option value="">Selecione</option>
            {% for g in generos %}
                <option value="{{ g }}"
                    {% if filme and filme.genero == g %}selected{% endif %}>
                    {{ g }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Status
        <select name="status" required>
            {% for s in status_opcoes %}
                <option value="{{ s }}"
                    {% if filme and filme.status == s %}selected{% endif %}>
                    {{ s }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label>
        Nota (0 a 10, opcional)
        <input type="number" name="nota" min="0" max="10"
               value="{{ filme.nota if filme and filme.nota is not none else '' }}">
    </label>

    <label>
        Sinopse
        <textarea name="sinopse" rows="4">{{ filme.sinopse if filme and filme.sinopse else '' }}</textarea>
    </label>

    <button class="botao" type="submit">{{ acao }}</button>
    <a class="botao secundario" href="{{ url_for('listar') }}">Cancelar</a>
</form>
{% endblock %}
